services:
  postgres:
    image: postgres:16
    container_name: standsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: standsync
    ports:
      - '5432:5432'
    volumes:
      - standsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: standsync-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - standsync_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  standsync_pgdata:
  standsync_redisdata: